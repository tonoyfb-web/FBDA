name: Build FBDA Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant to compile'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - both
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: locate
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "FBDA-Android-APK/settings.gradle.kts" ]; then
            echo "dir=FBDA-Android-APK" >> $GITHUB_OUTPUT
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" -print -quit | xargs -r dirname)
            if [ -z "$FOUND" ]; then
              echo "::error::Could not find settings.gradle.kts in this repository."
              exit 1
            fi
            echo "dir=$FOUND" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Firebase google-services.json
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Firebase google-services.json detected — FCM Push enabled."
          else
            echo "::warning::app/google-services.json not found — building without FCM plugin."
          fi

      - name: Build Installable Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (when requested)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'both'
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBDA-Blood-Donate-Debug-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact (when built)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: FBDA-Blood-Donate-Release-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          retention-days: 30
